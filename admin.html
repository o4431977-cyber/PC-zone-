<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PC Zone | Admin</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: #080a0d;
      color: #fff;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff6b00;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 18px 0;
      border-bottom: 1px solid #242a31;
      background: #0d1014;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logout {
      background: #242a31;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      transition: .2s;
    }

    .logout:hover {
      background: #ff6b00;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: min(430px, 100%);
      background: #11151a;
      border: 1px solid #252c34;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .login-box h1 {
      margin: 18px 0 5px;
      font-size: 28px;
    }

    .login-box > p {
      color: #9ca3af;
      margin-top: 0;
      margin-bottom: 25px;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      padding: 35px 0 70px;
    }

    .title {
      margin-bottom: 25px;
    }

    .title h1 {
      margin: 0 0 5px;
      font-size: 30px;
    }

    .title p {
      margin: 0;
      color: #9ca3af;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      background: #11151a;
      border: 1px solid #252c34;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 21px;
    }

    /* =========================
       FORM
    ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #303740;
      background: #080a0d;
      color: #fff;
      padding: 13px;
      border-radius: 10px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff6b00;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    select {
      cursor: pointer;
    }

    /* =========================
       IMAGE UPLOAD
    ========================= */

    .upload-box {
      border: 1px dashed #3a424c;
      border-radius: 14px;
      padding: 18px;
      background: #0b0e12;
    }

    .upload-box input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    .image-preview {
      display: none;
      margin-top: 15px;
      position: relative;
      width: 180px;
    }

    .image-preview.show {
      display: block;
    }

    .image-preview img {
      width: 180px;
      height: 130px;
      object-fit: contain;
      border-radius: 12px;
      background: #080a0d;
      border: 1px solid #303740;
    }

    .upload-status {
      display: block;
      margin-top: 8px;
      color: #9ca3af;
      font-size: 13px;
    }

    /* =========================
       CHECKBOX
    ========================= */

    .check-row {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox input {
      width: auto;
      accent-color: #ff6b00;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
      transition: .2s;
    }

    .primary {
      background: #ff6b00;
      color: #fff;
    }

    .secondary {
      background: #252c34;
      color: #fff;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    /* =========================
       MESSAGES
    ========================= */

    .error {
      color: #f87171;
      margin-top: 12px;
      font-size: 14px;
    }

    .success {
      color: #4ade80;
      margin-top: 12px;
      font-size: 14px;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products {
      display: grid;
      gap: 12px;
    }

    .product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      background: #090c10;
      border: 1px solid #252c34;
      border-radius: 14px;
    }

    .product-main {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .product-image {
      width: 75px;
      height: 65px;
      object-fit: contain;
      background: #11151a;
      border-radius: 9px;
      border: 1px solid #303740;
      flex-shrink: 0;
    }

    .product-info {
      min-width: 0;
    }

    .product-info h3 {
      margin: 0 0 5px;
      font-size: 17px;
    }

    .product-info p {
      margin: 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .product-actions button {
      padding: 8px 13px;
      border-radius: 8px;
      color: #fff;
    }

    .edit {
      background: #374151;
    }

    .delete {
      background: #b91c1c;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .product {
        flex-direction: column;
        align-items: stretch;
      }

      .product-main {
        align-items: flex-start;
      }

      .product-actions {
        width: 100%;
      }

      .product-actions button {
        flex: 1;
      }

      .title h1 {
        font-size: 24px;
      }

    }

  </style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginPage">

  <div class="login-box">

    <div class="logo">
      <span>PC</span> ZONE
    </div>

    <h1>لوحة التحكم</h1>

    <p>
      سجل الدخول لإدارة منتجات المتجر.
    </p>

    <form id="loginForm">

      <div class="field">

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="email"
          type="email"
          required
          autocomplete="email"
        >

      </div>


      <div class="field">

        <label>
          كلمة المرور
        </label>

        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        >

      </div>


      <button
        class="btn primary"
        type="submit"
        style="width:100%; margin-top:10px;"
      >
        تسجيل الدخول
      </button>


      <div id="loginMessage"></div>

    </form>

  </div>

</section>



<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<div id="adminPage" class="hidden">


<header>

  <div class="container nav">

    <div class="logo">
      <span>PC</span> ZONE
    </div>

    <button
      id="logoutBtn"
      class="logout"
    >
      تسجيل الخروج
    </button>

  </div>

</header>



<main>

<div class="container">


  <div class="title">

    <h1>
      لوحة إدارة المنتجات 🛠️
    </h1>

    <p>
      أضف وعدّل واحذف منتجات PC Zone من مكان واحد.
    </p>

  </div>



  <!-- =====================================================
       ADD PRODUCT
  ===================================================== -->

  <section class="card">

    <h2 id="formTitle">
      إضافة منتج جديد
    </h2>


    <form id="productForm">


      <input
        type="hidden"
        id="productId"
      >


      <div class="form-grid">


        <!-- NAME -->

        <div class="field">

          <label>
            اسم المنتج *
          </label>

          <input
            id="name"
            required
            placeholder="مثال: Dell Latitude 5520"
          >

        </div>



        <!-- CATEGORY -->

        <div class="field">

          <label>
            القسم *
          </label>

          <select
            id="category"
            required
          >

            <option value="">
              اختر القسم
            </option>

            <option value="laptops">
              💻 لابتوبات
            </option>

            <option value="pcs">
              🖥️ PC & Gaming
            </option>

            <option value="components">
              🧩 قطع الكمبيوتر
            </option>

            <option value="monitors">
              🎯 الشاشات
            </option>

            <option value="accessories">
              ⌨️ إكسسوارات
            </option>

            <option value="other">
              ⚡ منتجات أخرى
            </option>

          </select>

        </div>



        <!-- PRICE -->

        <div class="field">

          <label>
            السعر *
          </label>

          <input
            id="price"
            type="number"
            min="0"
            required
            placeholder="25000"
          >

        </div>



        <!-- OLD PRICE -->

        <div class="field">

          <label>
            السعر القديم
          </label>

          <input
            id="oldPrice"
            type="number"
            min="0"
            placeholder="28000"
          >

        </div>



        <!-- IMAGE -->

        <div class="field full">

          <label>
            صورة المنتج 📷
          </label>

          <div class="upload-box">

            <input
              id="imageFile"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
            >

            <span
              id="uploadStatus"
              class="upload-status"
            >
              اختر صورة من الموبايل
            </span>


            <div
              id="imagePreview"
              class="image-preview"
            >

              <img
                id="previewImage"
                alt="معاينة صورة المنتج"
              >

            </div>

          </div>


          <!-- Hidden URL -->
          <input
            id="imageUrl"
            type="hidden"
          >

        </div>



        <!-- SPECS -->

        <div class="field full">

          <label>
            المواصفات
          </label>

          <textarea
            id="specs"
            placeholder="Core i7 - RAM 16GB - SSD 512GB - RTX..."
          ></textarea>

        </div>



        <!-- DESCRIPTION -->

        <div class="field full">

          <label>
            وصف المنتج
          </label>

          <textarea
            id="description"
            placeholder="اكتب وصفًا مختصرًا وجذابًا للمنتج..."
          ></textarea>

        </div>


      </div>



      <!-- CHECKBOXES -->

      <div class="check-row">

        <div class="checkbox">

          <input
            id="stock"
            type="checkbox"
            checked
          >

          <label for="stock">
            المنتج متوفر
          </label>

        </div>


        <div class="checkbox">

          <input
            id="featured"
            type="checkbox"
          >

          <label for="featured">
            منتج مميز ⭐
          </label>

        </div>

      </div>



      <!-- BUTTONS -->

      <div class="actions">

        <button
          class="btn primary"
          type="submit"
          id="saveBtn"
        >
          حفظ المنتج
        </button>


        <button
          id="cancelEdit"
          class="btn secondary hidden"
          type="button"
        >
          إلغاء التعديل
        </button>

      </div>


      <div id="formMessage"></div>


    </form>

  </section>



  <!-- =====================================================
       PRODUCTS LIST
  ===================================================== -->

  <section class="card">

    <h2>
      المنتجات الحالية
    </h2>


    <div
      id="productsList"
      class="products"
    >
      جاري تحميل المنتجات...
    </div>

  </section>


</div>

</main>

</div>



<script>


// ======================================================
// SUPABASE CONFIG
// ======================================================

const SUPABASE_URL =
  "https://sbvwosejthyuotcsmvki.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qok45Wzs4mVmPwW8jlaxzA_qxuoSWdU";

const STORAGE_BUCKET =
  "product-images";


// ======================================================
// GLOBAL
// ======================================================

let products = [];

let currentImageUrl = "";


// ======================================================
// BASIC SUPABASE REQUEST
// ======================================================

async function supabaseRequest(
  url,
  options = {}
) {

  const response = await fetch(
    `${SUPABASE_URL}${url}`,
    {
      ...options,

      headers: {

        "Content-Type":
          "application/json",

        apikey:
          SUPABASE_KEY,

        ...options.headers

      }

    }
  );


  if (!response.ok) {

    const text =
      await response.text();

    throw new Error(
      text ||
      `Error ${response.status}`
    );

  }


  const text =
    await response.text();


  return text
    ? JSON.parse(text)
    : null;

}


// ======================================================
// LOGIN
// ======================================================

async function login(
  email,
  password
) {

  return await supabaseRequest(
    "/auth/v1/token?grant_type=password",
    {

      method: "POST",

      body: JSON.stringify({

        email,
        password

      })

    }
  );

}


// ======================================================
// LOGIN FORM
// ======================================================

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const email =
        document.getElementById(
          "email"
        ).value.trim();


      const password =
        document.getElementById(
          "password"
        ).value;


      const message =
        document.getElementById(
          "loginMessage"
        );


      message.className =
        "success";

      message.textContent =
        "جاري تسجيل الدخول...";


      try {

        const session =
          await login(
            email,
            password
          );


        localStorage.setItem(
          "pczone_access_token",
          session.access_token
        );


        localStorage.setItem(
          "pczone_refresh_token",
          session.refresh_token
        );


        showAdmin();

        await loadProducts();


      }

      catch (error) {

        console.error(error);

        message.className =
          "error";

        message.textContent =
          "بيانات الدخول غير صحيحة أو حدث خطأ.";

      }

    }
  );


// ======================================================
// AUTH HEADERS
// ======================================================

function authHeaders() {

  const token =
    localStorage.getItem(
      "pczone_access_token"
    );


  return {

    apikey:
      SUPABASE_KEY,

    Authorization:
      `Bearer ${token}`

  };

}


// ======================================================
// SHOW ADMIN
// ======================================================

function showAdmin() {

  document
    .getElementById("loginPage")
    .classList.add("hidden");


  document
    .getElementById("adminPage")
    .classList.remove("hidden");

}


// ======================================================
// IMAGE PREVIEW
// ======================================================

document
  .getElementById("imageFile")
  .addEventListener(
    "change",
    function () {

      const file =
        this.files[0];


      if (!file) {

        return;

      }


      const preview =
        document.getElementById(
          "previewImage"
        );


      const previewBox =
        document.getElementById(
          "imagePreview"
        );


      const url =
        URL.createObjectURL(file);


      preview.src =
        url;


      previewBox.classList.add(
        "show"
      );

    }
  );


// ======================================================
// UPLOAD IMAGE
// ======================================================

async function uploadImage(file) {

  if (!file) {

    return currentImageUrl || null;

  }


  const token =
    localStorage.getItem(
      "pczone_access_token"
    );


  if (!token) {

    throw new Error(
      "يجب تسجيل الدخول أولاً."
    );

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    `product-${Date.now()}-${Math.random()
      .toString(36)
      .substring(2, 9)}.${extension}`;


  const uploadResponse =
    await fetch(

      `${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${fileName}`,

      {

        method: "POST",

        headers: {

          apikey:
            SUPABASE_KEY,

          Authorization:
            `Bearer ${token}`,

          "Content-Type":
            file.type,

          "x-upsert":
            "false"

        },

        body:
          file

      }

    );


  if (!uploadResponse.ok) {

    const error =
      await uploadResponse.text();

    console.error(
      "Upload error:",
      error
    );

    throw new Error(
      error ||
      "فشل رفع الصورة"
    );

  }


  return (
    `${SUPABASE_URL}` +
    `/storage/v1/object/public/` +
    `${STORAGE_BUCKET}/${fileName}`
  );

}


// ======================================================
// LOAD PRODUCTS
// ======================================================

async function loadProducts() {

  const list =
    document.getElementById(
      "productsList"
    );


  list.innerHTML =
    "جاري تحميل المنتجات...";


  try {

    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/products?select=*&order=created_at.desc`,

        {

          headers:
            authHeaders()

        }

      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    products =
      await response.json();


    renderProducts();


  }

  catch (error) {

    console.error(error);

    list.innerHTML =
      `
      <p class="error">
        لم نستطع تحميل المنتجات.
      </p>
      `;

  }

}


// ======================================================
// RENDER PRODUCTS
// ======================================================

function renderProducts() {

  const list =
    document.getElementById(
      "productsList"
    );


  if (!products.length) {

    list.innerHTML =
      `
      <p>
        لا توجد منتجات حتى الآن.
      </p>
      `;

    return;

  }


  list.innerHTML =
    products
      .map(product => {

        const image =
          product.image_url
            ? `
              <img
                class="product-image"
                src="${escapeHtml(product.image_url)}"
                alt="${escapeHtml(product.name)}"
              >
            `
            :
            `
              <div
                class="product-image"
                style="
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-size:25px;
                "
              >
                💻
              </div>
            `;


        return `

          <div class="product">

            <div class="product-main">

              ${image}

              <div class="product-info">

                <h3>
                  ${escapeHtml(product.name)}
                </h3>

                <p>

                  ${Number(
                    product.price
                  ).toLocaleString("ar-EG")}

                  ج.م

                  —

                  ${escapeHtml(
                    getCategoryName(
                      product.category
                    )
                  )}

                </p>

              </div>

            </div>


            <div class="product-actions">

              <button
                class="edit"
                onclick="editProduct(${product.id})"
              >
                تعديل
              </button>


              <button
                class="delete"
                onclick="deleteProduct(${product.id})"
              >
                حذف
              </button>

            </div>

          </div>

        `;

      })
      .join("");

}


// ======================================================
// CATEGORY NAME
// ======================================================

function getCategoryName(category) {

  const categories = {

    laptops:
      "لابتوبات",

    pcs:
      "PC & Gaming",

    components:
      "قطع الكمبيوتر",

    monitors:
      "الشاشات",

    accessories:
      "إكسسوارات",

    other:
      "منتجات أخرى"

  };


  return (
    categories[category] ||
    category ||
    "غير محدد"
  );

}


// ======================================================
// ADD / UPDATE PRODUCT
// ======================================================

document
  .getElementById("productForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const saveButton =
        document.getElementById(
          "saveBtn"
        );


      const message =
        document.getElementById(
          "formMessage"
        );


      const id =
        document.getElementById(
          "productId"
        ).value;


      try {

        saveButton.disabled =
          true;


        saveButton.textContent =
          "جاري الحفظ...";


        message.className =
          "success";


        message.textContent =
          "جاري تجهيز المنتج...";


        // =========================================
        // IMAGE
        // =========================================

        const imageFile =
          document.getElementById(
            "imageFile"
          ).files[0];


        if (imageFile) {

          message.textContent =
            "جاري رفع الصورة...";


          currentImageUrl =
            await uploadImage(
              imageFile
            );


          document.getElementById(
            "imageUrl"
          ).value =
            currentImageUrl;

        }


        // =========================================
        // PRODUCT DATA
        // =========================================

        const product = {

          name:
            document.getElementById(
              "name"
            ).value.trim(),


          category:
            document.getElementById(
              "category"
            ).value,


          price:
            Number(
              document.getElementById(
                "price"
              ).value
            ),


          old_price:
            Number(
              document.getElementById(
                "oldPrice"
              ).value
            ) || null,


          image_url:
            document.getElementById(
              "imageUrl"
            ).value.trim() ||
            null,


          specs:
            document.getElementById(
              "specs"
            ).value.trim() ||
            null,


          description:
            document.getElementById(
              "description"
            ).value.trim() ||
            null,


          stock:
            document.getElementById(
              "stock"
            ).checked,


          featured:
            document.getElementById(
              "featured"
            ).checked

        };


        message.textContent =
          "جاري حفظ المنتج...";


        // =========================================
        // UPDATE
        // =========================================

        if (id) {

          const response =
            await fetch(

              `${SUPABASE_URL}/rest/v1/products?id=eq.${id}`,

              {

                method: "PATCH",

                headers: {

                  ...authHeaders(),

                  "Content-Type":
                    "application/json",

                  Prefer:
                    "return=minimal"

                },

                body:
                  JSON.stringify(
                    product
                  )

              }

            );


          if (!response.ok) {

            throw new Error(
              await response.text()
            );

          }


          message.textContent =
            "تم تعديل المنتج بنجاح ✅";

        }


        // =========================================
        // INSERT
        // =========================================

        else {

          const response =
            await fetch(

              `${SUPABASE_URL}/rest/v1/products`,

              {

                method: "POST",

                headers: {

                  ...authHeaders(),

                  "Content-Type":
                    "application/json",

                  Prefer:
                    "return=minimal"

                },

                body:
                  JSON.stringify(
                    product
                  )

              }

            );


          if (!response.ok) {

            throw new Error(
              await response.text()
            );

          }


          message.textContent =
            "تم إضافة المنتج بنجاح ✅";

        }


        await loadProducts();


        setTimeout(
          resetForm,
          700
        );


      }

      catch (error) {

        console.error(error);


        message.className =
          "error";


        message.textContent =
          "حدث خطأ: " +
          (
            error.message ||
            "تعذر حفظ المنتج"
          );

      }


      finally {

        saveButton.disabled =
          false;


        saveButton.textContent =
          "حفظ المنتج";

      }

    }
  );


// ======================================================
// EDIT PRODUCT
// ======================================================

window.editProduct =
  function(id) {

    const product =
      products.find(
        item =>
          Number(item.id) ===
          Number(id)
      );


    if (!product) {

      return;

    }


    document.getElementById(
      "productId"
    ).value =
      product.id;


    document.getElementById(
      "name"
    ).value =
      product.name || "";


    document.getElementById(
      "category"
    ).value =
      product.category || "";


    document.getElementById(
      "price"
    ).value =
      product.price || "";


    document.getElementById(
      "oldPrice"
    ).value =
      product.old_price || "";


    document.getElementById(
      "specs"
    ).value =
      product.specs || "";


    document.getElementById(
      "description"
    ).value =
      product.description || "";


    document.getElementById(
      "stock"
    ).checked =
      Boolean(
        product.stock
      );


    document.getElementById(
      "featured"
    ).checked =
      Boolean(
        product.featured
      );


    currentImageUrl =
      product.image_url || "";


    document.getElementById(
      "imageUrl"
    ).value =
      currentImageUrl;


    // Show old image

    if (product.image_url) {

      document.getElementById(
        "previewImage"
      ).src =
        product.image_url;


      document.getElementById(
        "imagePreview"
      ).classList.add(
        "show"
      );

    }


    document.getElementById(
      "formTitle"
    ).textContent =
      "تعديل المنتج ✏️";


    document.getElementById(
      "cancelEdit"
    ).classList.remove(
      "hidden"
    );


    document.getElementById(
      "formMessage"
    ).textContent =
      "أنت الآن تعدل هذا المنتج.";


    window.scrollTo({

      top: 0,

      behavior:
        "smooth"

    });

  };


// ======================================================
// DELETE PRODUCT
// ======================================================

window.deleteProduct =
  async function(id) {

    const confirmed =
      confirm(
        "هل أنت متأكد من حذف هذا المنتج؟"
      );


    if (!confirmed) {

      return;

    }


    try {

      const response =
        await fetch(

          `${SUPABASE_URL}/rest/v1/products?id=eq.${id}`,

          {

            method: "DELETE",

            headers:
              authHeaders()

          }

        );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      await loadProducts();


      alert(
        "تم حذف المنتج بنجاح ✅"
      );


    }

    catch (error) {

      console.error(error);

      alert(
        "حدث خطأ أثناء حذف المنتج."
      );

    }

  };


// ======================================================
// RESET FORM
// ======================================================

function resetForm() {

  document
    .getElementById(
      "productForm"
    )
    .reset();


  document.getElementById(
    "productId"
  ).value =
    "";


  document.getElementById(
    "imageUrl"
  ).value =
    "";


  document.getElementById(
    "imageFile"
  ).value =
    "";


  document.getElementById(
    "stock"
  ).checked =
    true;


  document.getElementById(
    "featured"
  ).checked =
    false;


  document.getElementById(
    "formTitle"
  ).textContent =
    "إضافة منتج جديد";


  document
    .getElementById(
      "cancelEdit"
    )
    .classList.add(
      "hidden"
    );


  document.getElementById(
    "imagePreview"
  ).classList.remove(
    "show"
  );


  document.getElementById(
    "uploadStatus"
  ).textContent =
    "اختر صورة من الموبايل";


  document.getElementById(
    "uploadStatus"
  ).style.color =
    "#9ca3af";


  document.getElementById(
    "formMessage"
  ).textContent =
    "";


  currentImageUrl =
    "";

}


// ======================================================
// CANCEL EDIT
// ======================================================

document
  .getElementById(
    "cancelEdit"
  )
  .addEventListener(
    "click",
    resetForm
  );


// ======================================================
// LOGOUT
// ======================================================

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    () => {

      localStorage.removeItem(
        "pczone_access_token"
      );


      localStorage.removeItem(
        "pczone_refresh_token"
      );


      location.reload();

    }
  );


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ======================================================
// AUTO LOGIN
// ======================================================

const savedToken =
  localStorage.getItem(
    "pczone_access_token"
  );


if (savedToken) {

  showAdmin();

  loadProducts();

}

</script>
