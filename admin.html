<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PC Zone | Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: #0b0d10;
      color: #fff;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid #252a31;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff6b00;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .logout {
      background: #252a31;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
    }

    .logout:hover {
      background: #ff6b00;
    }

    main {
      padding: 35px 0 60px;
    }

    .title {
      margin-bottom: 25px;
    }

    .title h1 {
      margin: 0 0 5px;
      font-size: 30px;
    }

    .title p {
      color: #9ca3af;
      margin: 0;
    }

    .card {
      background: #12161b;
      border: 1px solid #252a31;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      color: #cbd5e1;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #303740;
      background: #0b0d10;
      color: #fff;
      padding: 13px;
      border-radius: 10px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff6b00;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .checkbox input {
      width: auto;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
    }

    .primary {
      background: #ff6b00;
      color: #fff;
    }

    .secondary {
      background: #252a31;
      color: #fff;
    }

    .danger {
      background: #b91c1c;
      color: #fff;
    }

    .btn:hover {
      opacity: .85;
    }

    .products {
      display: grid;
      gap: 12px;
    }

    .product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      background: #0b0d10;
      border: 1px solid #252a31;
      border-radius: 13px;
    }

    .product-info {
      min-width: 0;
    }

    .product-info h3 {
      margin: 0 0 5px;
      font-size: 17px;
    }

    .product-info p {
      margin: 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .product-actions button {
      padding: 8px 12px;
      border-radius: 8px;
      color: #fff;
    }

    .edit {
      background: #374151;
    }

    .delete {
      background: #b91c1c;
    }

    .hidden {
      display: none !important;
    }

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: min(420px, 100%);
      background: #12161b;
      border: 1px solid #252a31;
      border-radius: 20px;
      padding: 30px;
    }

    .login-box h1 {
      margin-top: 0;
    }

    .login-box .field {
      margin-bottom: 15px;
    }

    .error {
      color: #f87171;
      margin-top: 12px;
      font-size: 14px;
    }

    .success {
      color: #4ade80;
      margin-top: 12px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .product {
        flex-direction: column;
        align-items: stretch;
      }

      .product-actions {
        width: 100%;
      }

      .product-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- ==============================
       LOGIN
  =============================== -->

  <section id="loginPage">

    <div class="login-box">

      <div class="logo">
        <span>PC</span> ZONE
      </div>

      <h1>لوحة التحكم</h1>

      <p>
        سجل الدخول لإدارة منتجات المتجر.
      </p>

      <form id="loginForm">

        <div class="field">

          <label>البريد الإلكتروني</label>

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
          >

        </div>

        <div class="field">

          <label>كلمة المرور</label>

          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
          >

        </div>

        <button
          class="btn primary"
          type="submit"
          style="width:100%;"
        >
          تسجيل الدخول
        </button>

        <div id="loginMessage"></div>

      </form>

    </div>

  </section>


  <!-- ==============================
       ADMIN
  =============================== -->

  <div id="adminPage" class="hidden">

    <header>

      <div class="container nav">

        <div class="logo">
          <span>PC</span> ZONE
        </div>

        <button
          id="logoutBtn"
          class="logout"
        >
          تسجيل الخروج
        </button>

      </div>

    </header>


    <main>

      <div class="container">

        <div class="title">

          <h1>لوحة إدارة المنتجات 🛠️</h1>

          <p>
            أضف وعدّل واحذف منتجات PC Zone.
          </p>

        </div>


        <!-- PRODUCT FORM -->

        <section class="card">

          <h2 id="formTitle">
            إضافة منتج جديد
          </h2>

          <form id="productForm">

            <input
              type="hidden"
              id="productId"
            >

            <div class="form-grid">

              <div class="field">

                <label>
                  اسم المنتج *
                </label>

                <input
                  id="name"
                  required
                  placeholder="مثال: Dell Latitude 5520"
                >

              </div>


              <div class="field">

                <label>
                  القسم *
                </label>

                <select
                  id="category"
                  required
                >

                  <option value="">
                    اختر القسم
                  </option>

                  <option value="laptops">
                    لابتوبات
                  </option>

                  <option value="pcs">
                    PC & Gaming
                  </option>

                  <option value="components">
                    قطع الكمبيوتر
                  </option>

                  <option value="monitors">
                    الشاشات
                  </option>

                  <option value="accessories">
                    إكسسوارات
                  </option>

                  <option value="other">
                    منتجات أخرى
                  </option>

                </select>

              </div>


              <div class="field">

                <label>
                  السعر *
                </label>

                <input
                  id="price"
                  type="number"
                  min="0"
                  required
                  placeholder="25000"
                >

              </div>


              <div class="field">

                <label>
                  السعر القديم
                </label>

                <input
                  id="oldPrice"
                  type="number"
                  min="0"
                  placeholder="28000"
                >

              </div>


              <div class="field full">

                <label>
                  رابط صورة المنتج
                </label>

                <input
                  id="imageUrl"
                  type="url"
                  placeholder="https://..."
                >

              </div>


              <div class="field full">

                <label>
                  المواصفات
                </label>

                <textarea
                  id="specs"
                  placeholder="Core i7 - RAM 16GB - SSD 512GB - RTX..."
                ></textarea>

              </div>


              <div class="field full">

                <label>
                  وصف المنتج
                </label>

                <textarea
                  id="description"
                  placeholder="اكتب وصفًا مختصرًا للمنتج..."
                ></textarea>

              </div>


              <div class="checkbox">

                <input
                  id="stock"
                  type="checkbox"
                  checked
                >

                <label for="stock">
                  المنتج متوفر
                </label>

              </div>


              <div class="checkbox">

                <input
                  id="featured"
                  type="checkbox"
                >

                <label for="featured">
                  منتج مميز ⭐
                </label>

              </div>

            </div>


            <div class="actions">

              <button
                class="btn primary"
                type="submit"
              >
                حفظ المنتج
              </button>

              <button
                id="cancelEdit"
                class="btn secondary hidden"
                type="button"
              >
                إلغاء التعديل
              </button>

            </div>


            <div id="formMessage"></div>

          </form>

        </section>


        <!-- PRODUCTS -->

        <section class="card">

          <h2>
            المنتجات الحالية
          </h2>

          <div
            id="productsList"
            class="products"
          >
            جاري تحميل المنتجات...
          </div>

        </section>

      </div>

    </main>

  </div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://sbvwosejthyuotcsmvki.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Qok45Wzs4mVmPwW8jlaxzA_qxuoSWdU";


  let products = [];


  // ==========================================
  // API
  // ==========================================

  async function supabaseRequest(
    url,
    options = {}
  ) {

    const response = await fetch(
      `${SUPABASE_URL}${url}`,
      {
        ...options,

        headers: {
          "Content-Type":
            "application/json",

          apikey:
            SUPABASE_KEY,

          ...options.headers
        }
      }
    );


    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(
        text || `Error ${response.status}`
      );

    }


    const text =
      await response.text();


    return text
      ? JSON.parse(text)
      : null;

  }


  // ==========================================
  // LOGIN
  // ==========================================

  async function login(
    email,
    password
  ) {

    return await supabaseRequest(
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        body: JSON.stringify({
          email,
          password
        })
      }
    );

  }


  // ==========================================
  // LOGIN FORM
  // ==========================================

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const email =
          document.getElementById(
            "email"
          ).value.trim();


        const password =
          document.getElementById(
            "password"
          ).value;


        const message =
          document.getElementById(
            "loginMessage"
          );


        message.className =
          "success";

        message.textContent =
          "جاري تسجيل الدخول...";


        try {

          const session =
            await login(
              email,
              password
            );


          localStorage.setItem(
            "pczone_access_token",
            session.access_token
          );


          localStorage.setItem(
            "pczone_refresh_token",
            session.refresh_token
          );


          showAdmin();

          await loadProducts();


        }

        catch (error) {

          console.error(error);

          message.className =
            "error";

          message.textContent =
            "بيانات الدخول غير صحيحة أو حدث خطأ.";

        }

      }
    );


  // ==========================================
  // AUTH HEADERS
  // ==========================================

  function authHeaders() {

    const token =
      localStorage.getItem(
        "pczone_access_token"
      );


    return {

      apikey:
        SUPABASE_KEY,

      Authorization:
        `Bearer ${token}`

    };

  }


  // ==========================================
  // SHOW ADMIN
  // ==========================================

  function showAdmin() {

    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("adminPage")
      .classList.remove("hidden");

  }


  // ==========================================
  // LOAD PRODUCTS
  // ==========================================

  async function loadProducts() {

    const list =
      document.getElementById(
        "productsList"
      );


    try {

      const response =
        await fetch(
          `${SUPABASE_URL}/rest/v1/products?select=*&order=created_at.desc`,
          {
            headers:
              authHeaders()
          }
        );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      products =
        await response.json();


      renderProducts();

    }

    catch (error) {

      console.error(error);

      list.innerHTML =
        `<p class="error">
          لم نستطع تحميل المنتجات.
        </p>`;

    }

  }


  // ==========================================
  // RENDER PRODUCTS
  // ==========================================

  function renderProducts() {

    const list =
      document.getElementById(
        "productsList"
      );


    if (!products.length) {

      list.innerHTML =
        `<p>لا توجد منتجات حتى الآن.</p>`;

      return;

    }


    list.innerHTML =
      products.map(product => `

        <div class="product">

          <div class="product-info">

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <p>
              ${Number(product.price).toLocaleString()}
              ج.م
              —
              ${escapeHtml(product.category)}
            </p>

          </div>


          <div class="product-actions">

            <button
              class="edit"
              onclick="editProduct(${product.id})"
            >
              تعديل
            </button>

            <button
              class="delete"
              onclick="deleteProduct(${product.id})"
            >
              حذف
            </button>

          </div>

        </div>

      `).join("");

  }


  // ==========================================
  // ADD / UPDATE PRODUCT
  // ==========================================

  document
    .getElementById("productForm")
    .addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const id =
          document.getElementById(
            "productId"
          ).value;


        const product = {

          name:
            document.getElementById(
              "name"
            ).value.trim(),

          category:
            document.getElementById(
              "category"
            ).value,

          price:
            Number(
              document.getElementById(
                "price"
              ).value
            ),

          old_price:
            Number(
              document.getElementById(
                "oldPrice"
              ).value
            ) || null,

          image_url:
            document.getElementById(
              "imageUrl"
            ).value.trim() || null,

          specs:
            document.getElementById(
              "specs"
            ).value.trim() || null,

          description:
            document.getElementById(
              "description"
            ).value.trim() || null,

          stock:
            document.getElementById(
              "stock"
            ).checked,

          featured:
            document.getElementById(
              "featured"
            ).checked

        };


        const message =
          document.getElementById(
            "formMessage"
          );


        try {

          message.className =
            "success";

          message.textContent =
            "جاري الحفظ...";


          if (id) {

            // UPDATE

            const response =
              await fetch(
                `${SUPABASE_URL}/rest/v1/products?id=eq.${id}`,
                {
                  method: "PATCH",

                  headers: {
                    ...authHeaders(),
                    "Content-Type":
                      "application/json",
                    Prefer:
                      "return=minimal"
                  },

                  body:
                    JSON.stringify(product)

                }
              );


            if (!response.ok) {

              throw new Error(
                await response.text()
              );

            }


            message.textContent =
              "تم تعديل المنتج بنجاح ✅";

          }

          else {

            // INSERT

            const response =
              await fetch(
                `${SUPABASE_URL}/rest/v1/products`,
                {
                  method: "POST",

                  headers: {
                    ...authHeaders(),
                    "Content-Type":
                      "application/json",
                    Prefer:
                      "return=minimal"
                  },

                  body:
                    JSON.stringify(product)

                }
              );


            if (!response.ok) {

              throw new Error(
                await response.text()
              );

            }


            message.textContent =
              "تم إضافة المنتج بنجاح ✅";

          }


          resetForm();

          await loadProducts();


        }

        catch (error) {

          console.error(error);

          message.className =
            "error";

          message.textContent =
            "حدث خطأ أثناء حفظ المنتج.";

        }

      }
    );


  // ==========================================
  // EDIT
  // ==========================================

  window.editProduct =
    function(id) {

      const product =
        products.find(
          item =>
            Number(item.id) ===
            Number(id)
        );


      if (!product) return;


      document.getElementById(
        "productId"
      ).value = product.id;


      document.getElementById(
        "name"
      ).value =
        product.name || "";


      document.getElementById(
        "category"
      ).value =
        product.category || "";


      document.getElementById(
        "price"
      ).value =
        product.price || "";


      document.getElementById(
        "oldPrice"
      ).value =
        product.old_price || "";


      document.getElementById(
        "imageUrl"
      ).value =
        product.image_url || "";


      document.getElementById(
        "specs"
      ).value =
        product.specs || "";


      document.getElementById(
        "description"
      ).value =
        product.description || "";


      document.getElementById(
        "stock"
      ).checked =
        product.stock;


      document.getElementById(
        "featured"
      ).checked =
        product.featured;


      document.getElementById(
        "formTitle"
      ).textContent =
        "تعديل المنتج";


      document.getElementById(
        "cancelEdit"
      ).classList.remove(
        "hidden"
      );


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };


  // ==========================================
  // DELETE
  // ==========================================

  window.deleteProduct =
    async function(id) {

      const confirmed =
        confirm(
          "هل أنت متأكد من حذف هذا المنتج؟"
        );


      if (!confirmed) return;


      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/products?id=eq.${id}`,
            {
              method: "DELETE",

              headers:
                authHeaders()
            }
          );


        if (!response.ok) {

          throw new Error(
            await response.text()
          );

        }


        await loadProducts();

      }

      catch (error) {

        console.error(error);

        alert(
          "حدث خطأ أثناء حذف المنتج."
        );

      }

    };


  // ==========================================
  // RESET
  // ==========================================

  function resetForm() {

    document
      .getElementById(
        "productForm"
      )
      .reset();


    document.getElementById(
      "productId"
    ).value = "";


    document.getElementById(
      "stock"
    ).checked = true;


    document.getElementById(
      "formTitle"
    ).textContent =
      "إضافة منتج جديد";


    document
      .getElementById(
        "cancelEdit"
      )
      .classList.add(
        "hidden"
      );

  }


  document
    .getElementById(
      "cancelEdit"
    )
    .addEventListener(
      "click",
      resetForm
    );


  // ==========================================
  // LOGOUT
  // ==========================================

  document
    .getElementById(
      "logoutBtn"
    )
    .addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          "pczone_access_token"
        );

        localStorage.removeItem(
          "pczone_refresh_token"
        );


        location.reload();

      }
    );


  // ==========================================
  // HTML ESCAPE
  // ==========================================

  function escapeHtml(value) {

    return String(value || "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================
  // AUTO LOGIN
  // ==========================================

  const token =
    localStorage.getItem(
      "pczone_access_token"
    );


  if (token) {

    showAdmin();

    loadProducts();

  }

</script>

</body>
</html>
