
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PC Zone | Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: #0b0d10;
      color: #fff;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid #252a31;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff6b00;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .logout {
      background: #252a31;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
    }

    .logout:hover {
      background: #ff6b00;
    }

    main {
      padding: 35px 0 60px;
    }

    .title {
      margin-bottom: 25px;
    }

    .title h1 {
      margin: 0 0 5px;
      font-size: 30px;
    }

    .title p {
      color: #9ca3af;
      margin: 0;
    }

    .card {
      background: #12161b;
      border: 1px solid #252a31;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      color: #cbd5e1;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #303740;
      background: #0b0d10;
      color: #fff;
      padding: 13px;
      border-radius: 10px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff6b00;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background: #ff6b00;
      color: #fff;
      border: 0;
      padding: 9px 14px;
      border-radius: 8px;
      margin-left: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .image-preview {
      margin-top: 10px;
      display: none;
    }

    .image-preview img {
      width: 150px;
      height: 110px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #303740;
    }

    .image-preview.show {
      display: block;
    }

    .image-note {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 4px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .checkbox input {
      width: auto;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
    }

    .primary {
      background: #ff6b00;
      color: #fff;
    }

    .secondary {
      background: #252a31;
      color: #fff;
    }

    .btn:hover {
      opacity: .85;
    }

    .products {
      display: grid;
      gap: 12px;
    }

    .product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      background: #0b0d10;
      border: 1px solid #252a31;
      border-radius: 13px;
    }

    .product-info {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .product-image {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #303740;
      background: #12161b;
      flex-shrink: 0;
    }

    .product-info h3 {
      margin: 0 0 5px;
      font-size: 17px;
    }

    .product-info p {
      margin: 0;
      color: #9ca3af;
      font-size: 13px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .product-actions button {
      padding: 8px 12px;
      border-radius: 8px;
      color: #fff;
    }

    .edit {
      background: #374151;
    }

    .delete {
      background: #b91c1c;
    }

    .hidden {
      display: none !important;
    }

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: min(420px, 100%);
      background: #12161b;
      border: 1px solid #252a31;
      border-radius: 20px;
      padding: 30px;
    }

    .login-box h1 {
      margin-top: 0;
    }

    .login-box .field {
      margin-bottom: 15px;
    }

    .error {
      color: #f87171;
      margin-top: 12px;
      font-size: 14px;
    }

    .success {
      color: #4ade80;
      margin-top: 12px;
      font-size: 14px;
    }

    .loading {
      opacity: .7;
      pointer-events: none;
    }

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .product {
        flex-direction: column;
        align-items: stretch;
      }

      .product-actions {
        width: 100%;
      }

      .product-actions button {
        flex: 1;
      }

    }
  </style>
</head>

<body>

  <!-- ==============================
       LOGIN
  =============================== -->

  <section id="loginPage">

    <div class="login-box">

      <div class="logo">
        <span>PC</span> ZONE
      </div>

      <h1>لوحة التحكم</h1>

      <p>
        سجل الدخول لإدارة منتجات المتجر.
      </p>

      <form id="loginForm">

        <div class="field">

          <label>البريد الإلكتروني</label>

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
          >

        </div>

        <div class="field">

          <label>كلمة المرور</label>

          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
          >

        </div>

        <button
          id="loginBtn"
          class="btn primary"
          type="submit"
          style="width:100%;"
        >
          تسجيل الدخول
        </button>

        <div id="loginMessage"></div>

      </form>

    </div>

  </section>


  <!-- ==============================
       ADMIN
  =============================== -->

  <div id="adminPage" class="hidden">

    <header>

      <div class="container nav">

        <div class="logo">
          <span>PC</span> ZONE
        </div>

        <button
          id="logoutBtn"
          class="logout"
        >
          تسجيل الخروج
        </button>

      </div>

    </header>


    <main>

      <div class="container">

        <div class="title">

          <h1>لوحة إدارة المنتجات 🛠️</h1>

          <p>
            أضف وعدّل واحذف منتجات PC Zone.
          </p>

        </div>


        <!-- ==============================
             PRODUCT FORM
        =============================== -->

        <section class="card">

          <h2 id="formTitle">
            إضافة منتج جديد
          </h2>

          <form id="productForm">

            <input
              type="hidden"
              id="productId"
            >

            <div class="form-grid">

              <!-- NAME -->

              <div class="field">

                <label>
                  اسم المنتج *
                </label>

                <input
                  id="name"
                  required
                  placeholder="مثال: Dell Latitude 5520"
                >

              </div>


              <!-- CATEGORY -->

              <div class="field">

                <label>
                  القسم *
                </label>

                <select
                  id="category"
                  required
                >

                  <option value="">
                    اختر القسم
                  </option>

                  <option value="laptops">
                    لابتوبات
                  </option>

                  <option value="pcs">
                    PC & Gaming
                  </option>

                  <option value="components">
                    قطع الكمبيوتر
                  </option>

                  <option value="monitors">
                    الشاشات
                  </option>

                  <option value="accessories">
                    إكسسوارات
                  </option>

                  <option value="other">
                    منتجات أخرى
                  </option>

                </select>

              </div>


              <!-- PRICE -->

              <div class="field">

                <label>
                  السعر *
                </label>

                <input
                  id="price"
                  type="number"
                  min="0"
                  required
                  placeholder="25000"
                >

              </div>


              <!-- OLD PRICE -->

              <div class="field">

                <label>
                  السعر القديم
                </label>

                <input
                  id="oldPrice"
                  type="number"
                  min="0"
                  placeholder="28000"
                >

              </div>


              <!-- IMAGE UPLOAD -->

              <div class="field full">

                <label>
                  صورة المنتج
                </label>

                <input
                  id="imageFile"
                  type="file"
                  accept="image/*"
                >

                <div class="image-note">
                  اختر صورة من الموبايل أو الكمبيوتر. سيتم رفعها تلقائيًا إلى Storage.
                </div>

                <div
                  id="imagePreview"
                  class="image-preview"
                >
                  <img
                    id="previewImage"
                    alt="معاينة الصورة"
                  >
                </div>

              </div>


              <!-- SPECS -->

              <div class="field full">

                <label>
                  المواصفات
                </label>

                <textarea
                  id="specs"
                  placeholder="Core i7 - RAM 16GB - SSD 512GB - RTX..."
                ></textarea>

              </div>


              <!-- DESCRIPTION -->

              <div class="field full">

                <label>
                  وصف المنتج
                </label>

                <textarea
                  id="description"
                  placeholder="اكتب وصفًا مختصرًا للمنتج..."
                ></textarea>

              </div>


              <!-- STOCK -->

              <div class="checkbox">

                <input
                  id="stock"
                  type="checkbox"
                  checked
                >

                <label for="stock">
                  المنتج متوفر
                </label>

              </div>


              <!-- FEATURED -->

              <div class="checkbox">

                <input
                  id="featured"
                  type="checkbox"
                >

                <label for="featured">
                  منتج مميز ⭐
                </label>

              </div>

            </div>


            <div class="actions">

              <button
                id="saveProductBtn"
                class="btn primary"
                type="submit"
              >
                حفظ المنتج
              </button>

              <button
                id="cancelEdit"
                class="btn secondary hidden"
                type="button"
              >
                إلغاء التعديل
              </button>

            </div>


            <div id="formMessage"></div>

          </form>

        </section>


        <!-- ==============================
             PRODUCTS
        =============================== -->

        <section class="card">

          <h2>
            المنتجات الحالية
          </h2>

          <div
            id="productsList"
            class="products"
          >
            جاري تحميل المنتجات...
          </div>

        </section>

      </div>

    </main>

  </div>


<script>

  /* ==========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "https://sbvwosejthyuotcsmvki.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Qok45Wzs4mVmPwW8jlaxzA_qxuoSWdU";

  /*
    اسم الـBucket بالضبط
  */
  const STORAGE_BUCKET =
    "products-image";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true
        }
      }
    );


  let products = [];

  let currentImageUrl = null;


  /* ==========================================
     SHOW / HIDE
  ========================================== */

  function showAdmin() {

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("adminPage")
      .classList.remove("hidden");

  }


  function showLogin() {

    document
      .getElementById("adminPage")
      .classList.add("hidden");

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

  }


  /* ==========================================
     LOGIN
  ========================================== */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const message =
          document.getElementById(
            "loginMessage"
          );

        const loginBtn =
          document.getElementById(
            "loginBtn"
          );

        message.className = "success";
        message.textContent =
          "جاري تسجيل الدخول...";

        loginBtn.disabled = true;

        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });


          if (error) {
            throw error;
          }


          if (!data.session) {
            throw new Error(
              "لم يتم إنشاء Session."
            );
          }


          message.className =
            "success";

          message.textContent =
            "تم تسجيل الدخول بنجاح ✅";


          showAdmin();

          await loadProducts();

        }

        catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );

          message.className =
            "error";

          message.textContent =
            error.message ||
            "بيانات الدخول غير صحيحة.";

        }

        finally {

          loginBtn.disabled =
            false;

        }

      }
    );


  /* ==========================================
     SESSION
  ========================================== */

  supabaseClient.auth.onAuthStateChange(
    async function(event, session) {

      console.log(
        "AUTH EVENT:",
        event
      );


      if (
        session &&
        (
          event === "SIGNED_IN" ||
          event === "TOKEN_REFRESHED"
        )
      ) {

        showAdmin();

      }


      if (
        event === "SIGNED_OUT"
      ) {

        showLogin();

      }

    }
  );


  /* ==========================================
     LOAD PRODUCTS
  ========================================== */

  async function loadProducts() {

    const list =
      document.getElementById(
        "productsList"
      );


    list.innerHTML =
      "جاري تحميل المنتجات...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {
        throw error;
      }


      products =
        data || [];


      renderProducts();

    }

    catch (error) {

      console.error(
        "LOAD PRODUCTS ERROR:",
        error
      );


      list.innerHTML =
        `<p class="error">
          لم نستطع تحميل المنتجات.<br>
          ${escapeHtml(error.message)}
        </p>`;

    }

  }


  /* ==========================================
     RENDER PRODUCTS
  ========================================== */

  function renderProducts() {

    const list =
      document.getElementById(
        "productsList"
      );


    if (!products.length) {

      list.innerHTML =
        `<p>
          لا توجد منتجات حتى الآن.
        </p>`;

      return;

    }


    list.innerHTML =
      products
        .map(product => {

          const image =
            product.image_url
              ? `
                <img
                  class="product-image"
                  src="${escapeHtml(product.image_url)}"
                  alt="${escapeHtml(product.name)}"
                  onerror="this.style.display='none'"
                >
              `
              : "";


          return `

            <div class="product">

              <div class="product-info">

                ${image}

                <div>

                  <h3>
                    ${escapeHtml(product.name)}
                  </h3>

                  <p>
                    ${Number(
                      product.price || 0
                    ).toLocaleString()}
                    ج.م
                    —
                    ${escapeHtml(
                      product.category
                    )}
                  </p>

                </div>

              </div>


              <div class="product-actions">

                <button
                  class="edit"
                  onclick="editProduct(${product.id})"
                >
                  تعديل
                </button>

                <button
                  class="delete"
                  onclick="deleteProduct(${product.id})"
                >
                  حذف
                </button>

              </div>

            </div>

          `;

        })
        .join("");

  }


  /* ==========================================
     IMAGE PREVIEW
  ========================================== */

  document
    .getElementById("imageFile")
    .addEventListener(
      "change",
      function() {

        const file =
          this.files[0];

        const preview =
          document.getElementById(
            "imagePreview"
          );

        const previewImage =
          document.getElementById(
            "previewImage"
          );


        if (!file) {

          preview.classList.remove(
            "show"
          );

          previewImage.src = "";

          return;

        }


        if (!file.type.startsWith("image/")) {

          alert(
            "من فضلك اختر ملف صورة فقط."
          );

          this.value = "";

          preview.classList.remove(
            "show"
          );

          return;

        }


        const maxSize =
          5 * 1024 * 1024;


        if (file.size > maxSize) {

          alert(
            "حجم الصورة يجب ألا يتجاوز 5MB."
          );

          this.value = "";

          preview.classList.remove(
            "show"
          );

          return;

        }


        const imageUrl =
          URL.createObjectURL(file);


        previewImage.src =
          imageUrl;


        preview.classList.add(
          "show"
        );

      }
    );


  /* ==========================================
     UPLOAD IMAGE
  ========================================== */

  async function uploadProductImage(file) {

    if (!file) {
      return null;
    }


    if (!file.type.startsWith("image/")) {

      throw new Error(
        "الملف المختار ليس صورة."
      );

    }


    const maxSize =
      5 * 1024 * 1024;


    if (file.size > maxSize) {

      throw new Error(
        "حجم الصورة أكبر من 5MB."
      );

    }


    /*
      اسم فريد للصورة
    */

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const safeExtension =
      extension.replace(
        /[^a-z0-9]/g,
        ""
      ) || "jpg";


    const fileName =
      `${Date.now()}-${crypto.randomUUID()}.${safeExtension}`;


    const filePath =
      `products/${fileName}`;


    /*
      Upload
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );


    if (error) {

      console.error(
        "STORAGE UPLOAD ERROR:",
        error
      );

      throw error;

    }


    /*
      Get Public URL
    */

    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(
          data.path
        );


    if (
      !publicData ||
      !publicData.publicUrl
    ) {

      throw new Error(
        "تم رفع الصورة ولكن لم نستطع إنشاء رابط الصورة."
      );

    }


    return publicData.publicUrl;

  }


  /* ==========================================
     ADD / UPDATE PRODUCT
  ========================================== */

  document
    .getElementById("productForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const id =
          document
            .getElementById("productId")
            .value;


        const selectedFile =
          document
            .getElementById("imageFile")
            .files[0];


        const message =
          document.getElementById(
            "formMessage"
          );


        const saveButton =
          document.getElementById(
            "saveProductBtn"
          );


        try {

          saveButton.disabled =
            true;

          saveButton.classList.add(
            "loading"
          );


          message.className =
            "success";

          message.textContent =
            "جاري حفظ المنتج...";


          /*
            لو فيه صورة جديدة:
            نرفعها أولًا.
          */

          let imageUrl =
            currentImageUrl;


          if (selectedFile) {

            message.textContent =
              "جاري رفع الصورة...";


            imageUrl =
              await uploadProductImage(
                selectedFile
              );

          }


          /*
            بيانات المنتج
          */

          const product = {

            name:
              document
                .getElementById("name")
                .value
                .trim(),

            category:
              document
                .getElementById("category")
                .value,

            price:
              Number(
                document
                  .getElementById("price")
                  .value
              ),

            old_price:
              Number(
                document
                  .getElementById("oldPrice")
                  .value
              ) || null,

            image_url:
              imageUrl || null,

            specs:
              document
                .getElementById("specs")
                .value
                .trim() || null,

            description:
              document
                .getElementById("description")
                .value
                .trim() || null,

            stock:
              document
                .getElementById("stock")
                .checked,

            featured:
              document
                .getElementById("featured")
                .checked

          };


          message.textContent =
            id
              ? "جاري تعديل المنتج..."
              : "جاري إضافة المنتج...";


          let result;


          if (id) {

            /*
              UPDATE
            */

            result =
              await supabaseClient
                .from("products")
                .update(product)
                .eq("id", id);

          }

          else {

            /*
              INSERT
            */

            result =
              await supabaseClient
                .from("products")
                .insert(product);

          }


          if (result.error) {

            throw result.error;

          }


          message.className =
            "success";


          message.textContent =
            id
              ? "تم تعديل المنتج بنجاح ✅"
              : "تم إضافة المنتج بنجاح ✅";


          resetForm();

          await loadProducts();

        }

        catch (error) {

          console.error(
            "SAVE PRODUCT ERROR:",
            error
          );


          message.className =
            "error";


          /*
            رسالة أوضح لمشكلة Storage
          */

          if (
            error.message &&
            (
              error.message
                .toLowerCase()
                .includes("storage") ||
              error.message
                .toLowerCase()
                .includes("policy") ||
              error.message
                .toLowerCase()
                .includes("row-level security") ||
              error.statusCode === "403"
            )
          ) {

            message.innerHTML =
              `
              فشل رفع الصورة بسبب صلاحيات Storage.<br>
              تأكد من وجود Policy للـBucket
              <b>${STORAGE_BUCKET}</b>.
              `;

          }

          else {

            message.textContent =
              "حدث خطأ: " +
              (
                error.message ||
                "خطأ غير معروف"
              );

          }

        }

        finally {

          saveButton.disabled =
            false;

          saveButton.classList.remove(
            "loading"
          );

        }

      }
    );


  /* ==========================================
     EDIT PRODUCT
  ========================================== */

  window.editProduct =
    function(id) {

      const product =
        products.find(
          item =>
            Number(item.id) ===
            Number(id)
        );


      if (!product) {
        return;
      }


      document.getElementById(
        "productId"
      ).value =
        product.id;


      document.getElementById(
        "name"
      ).value =
        product.name || "";


      document.getElementById(
        "category"
      ).value =
        product.category || "";


      document.getElementById(
        "price"
      ).value =
        product.price || "";


      document.getElementById(
        "oldPrice"
      ).value =
        product.old_price || "";


      document.getElementById(
        "specs"
      ).value =
        product.specs || "";


      document.getElementById(
        "description"
      ).value =
        product.description || "";


      document.getElementById(
        "stock"
      ).checked =
        Boolean(
          product.stock
        );


      document.getElementById(
        "featured"
      ).checked =
        Boolean(
          product.featured
        );


      /*
        نحفظ رابط الصورة القديمة
        لو المستخدم لم يختر صورة جديدة.
      */

      currentImageUrl =
        product.image_url || null;


      document.getElementById(
        "formTitle"
      ).textContent =
        "تعديل المنتج";


      document
        .getElementById("cancelEdit")
        .classList.remove(
          "hidden"
        );


      /*
        عرض الصورة القديمة
      */

      const preview =
        document.getElementById(
          "imagePreview"
        );

      const previewImage =
        document.getElementById(
          "previewImage"
        );


      if (currentImageUrl) {

        previewImage.src =
          currentImageUrl;

        preview.classList.add(
          "show"
        );

      }

      else {

        previewImage.src = "";

        preview.classList.remove(
          "show"
        );

      }


      document.getElementById(
        "imageFile"
      ).value = "";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };


  /* ==========================================
     DELETE PRODUCT
  ========================================== */

  window.deleteProduct =
    async function(id) {

      const confirmed =
        confirm(
          "هل أنت متأكد من حذف هذا المنتج؟"
        );


      if (!confirmed) {
        return;
      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


        if (error) {
          throw error;
        }


        await loadProducts();

      }

      catch (error) {

        console.error(
          "DELETE ERROR:",
          error
        );


        alert(
          "حدث خطأ أثناء حذف المنتج:\n" +
          (
            error.message ||
            "خطأ غير معروف"
          )
        );

      }

    };


  /* ==========================================
     RESET FORM
  ========================================== */

  function resetForm() {

    document
      .getElementById("productForm")
      .reset();


    document.getElementById(
      "productId"
    ).value = "";


    document.getElementById(
      "stock"
    ).checked = true;


    document.getElementById(
      "formTitle"
    ).textContent =
      "إضافة منتج جديد";


    document
      .getElementById("cancelEdit")
      .classList.add(
        "hidden"
      );


    document.getElementById(
      "imageFile"
    ).value = "";


    document.getElementById(
      "imagePreview"
    ).classList.remove(
      "show"
    );


    document.getElementById(
      "previewImage"
    ).src = "";


    currentImageUrl = null;

  }


  document
    .getElementById("cancelEdit")
    .addEventListener(
      "click",
      resetForm
    );


  /* ==========================================
     LOGOUT
  ========================================== */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async function() {

        try {

          await supabaseClient.auth.signOut();

        }

        catch (error) {

          console.error(
            "LOGOUT ERROR:",
            error
          );

        }


        showLogin();

      }
    );


  /* ==========================================
     HTML ESCAPE
  ========================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ==========================================
     INITIALIZE APP
  ========================================== */

  async function initializeApp() {

    try {

      /*
        Supabase يتولى Session وRefresh
        تلقائيًا.
      */

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {
        throw error;
      }


      if (data.session) {

        showAdmin();

        await loadProducts();

      }

      else {

        showLogin();

      }

    }

    catch (error) {

      console.error(
        "INITIALIZE ERROR:",
        error
      );

      showLogin();

    }

  }


  initializeApp();

</script>

</body>
</html>
