  </style></head><body><section id="loginPage">  <div class="login-box"><div class="logo">

</div>

<h1>لوحة التحكم</h1>

<p>

<form id="loginForm">

  <section class="card">

    <h2>
      المنتجات الحالية

      id="productsList"
      class="products"
    >
      جاري تحميل المنتجات...
    </div>

  </section>

</div>

  </main></div><script>

  /* ==========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "https://sbvwosejthyuotcsmvki.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Qok45Wzs4mVmPwW8jlaxzA_qxuoSWdU";


  let products = [];


  /* ==========================================
     SESSION STORAGE
  ========================================== */

  function saveSession(session) {

    localStorage.setItem(
      "pczone_access_token",
      session.access_token
    );

    localStorage.setItem(
      "pczone_refresh_token",
      session.refresh_token
    );

    if (session.expires_at) {

      localStorage.setItem(
        "pczone_expires_at",
        session.expires_at
      );

    }

  }


  function clearSession() {

    localStorage.removeItem(
      "pczone_access_token"
    );

    localStorage.removeItem(
      "pczone_refresh_token"
    );

    localStorage.removeItem(
      "pczone_expires_at"
    );

  }


  function getAccessToken() {

    return localStorage.getItem(
      "pczone_access_token"
    );

  }


  function getRefreshToken() {

    return localStorage.getItem(
      "pczone_refresh_token"
    );

  }


  /* ==========================================
     LOGIN
  ========================================== */

  async function login(email, password) {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.message ||
        "فشل تسجيل الدخول"
      );

    }


    saveSession(data);

    return data;

  }


  /* ==========================================
     REFRESH SESSION
  ========================================== */

  async function refreshSession() {

    const refreshToken =
      getRefreshToken();


    if (!refreshToken) {

      throw new Error(
        "لا يوجد Refresh Token"
      );

    }


    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },

        body: JSON.stringify({
          refresh_token: refreshToken
        })
      }
    );


    const data = await response.json();


    if (!response.ok) {

      clearSession();

      throw new Error(
        data.error_description ||
        data.message ||
        "انتهت الجلسة"
      );

    }


    saveSession(data);

    return data;

  }


  /* ==========================================
     MAKE AUTH REQUEST
  ========================================== */

  async function authFetch(
    url,
    options = {},
    retry = true
  ) {

    let token =
      getAccessToken();


    if (!token) {

      throw new Error(
        "لا يوجد تسجيل دخول"
      );

    }


    const headers = {
      ...(options.headers || {}),
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${token}`
    };


    let response =
      await fetch(
        url,
        {
          ...options,
          headers
        }
      );


    /*
      لو التوكن انتهى، نعمل Refresh
      وبعدها نعيد الطلب مرة واحدة.
    */

    if (
      response.status === 401 ||
      response.status === 403
    ) {

      const errorText =
        await response.clone().text();


      if (
        retry &&
        (
          errorText.includes("JWT") ||
          errorText.includes("exp") ||
          errorText.includes("expired") ||
          response.status === 401
        )
      ) {

        try {

          await refreshSession();

          return await authFetch(
            url,
            options,
            false
          );

        }

        catch (refreshError) {

          clearSession();

          showLogin();

          throw refreshError;

        }

      }

    }


    return response;

  }


  /* ==========================================
     SHOW / HIDE PAGES
  ========================================== */

  function showAdmin() {

    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("adminPage")
      .classList.remove("hidden");

  }


  function showLogin() {

    document
      .getElementById("adminPage")
      .classList.add("hidden");


    document
      .getElementById("loginPage")
      .classList.remove("hidden");

  }


  /* ==========================================
     LOGIN FORM
  ========================================== */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const message =
          document
            .getElementById("loginMessage");


        message.className =
          "success";

        message.textContent =
          "جاري تسجيل الدخول...";


        try {

          await login(
            email,
            password
          );


          message.textContent =
            "تم تسجيل الدخول بنجاح ✅";


          showAdmin();

          await loadProducts();

        }

        catch (error) {

          console.error(error);

          message.className =
            "error";

          message.textContent =
            error.message ||
            "بيانات الدخول غير صحيحة.";

        }

      }
    );


  /* ==========================================
     LOAD PRODUCTS
  ========================================== */

  async function loadProducts() {

    const list =
      document.getElementById(
        "productsList"
      );


    list.innerHTML =
      "جاري تحميل المنتجات...";


    try {

      const response =
        await authFetch(
          `${SUPABASE_URL}/rest/v1/products?select=*&order=created_at.desc`,
          {
            method: "GET"
          }
        );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      products =
        await response.json();


      renderProducts();

    }

    catch (error) {

      console.error(error);

      list.innerHTML =
        `<p class="error">
          لم نستطع تحميل المنتجات.
          ${escapeHtml(error.message)}
        </p>`;

    }

  }


  /* ==========================================
     RENDER PRODUCTS
  ========================================== */

  function renderProducts() {

    const list =
      document.getElementById(
        "productsList"
      );


    if (!products.length) {

      list.innerHTML =
        `<p>لا توجد منتجات حتى الآن.</p>`;

      return;

    }


    list.innerHTML =
      products
        .map(product => `

          <div class="product">

            <div class="product-info">

              <h3>
                ${escapeHtml(product.name)}
              </h3>

              <p>
                ${Number(product.price || 0).toLocaleString()}
                ج.م
                —
                ${escapeHtml(product.category)}
              </p>

            </div>

            <div class="product-actions">

              <button
                class="edit"
                onclick="editProduct(${product.id})"
              >
                تعديل
              </button>

              <button
                class="delete"
                onclick="deleteProduct(${product.id})"
              >
                حذف
              </button>

            </div>

          </div>

        `)
        .join("");

  }


  /* ==========================================
     ADD / UPDATE PRODUCT
  ========================================== */

  document
    .getElementById("productForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const id =
          document
            .getElementById("productId")
            .value;


        const product = {

          name:
            document
              .getElementById("name")
              .value
              .trim(),

          category:
            document
              .getElementById("category")
              .value,

          price:
            Number(
              document
                .getElementById("price")
                .value
            ),

          old_price:
            Number(
              document
                .getElementById("oldPrice")
                .value
            ) || null,

          image_url:
            document
              .getElementById("imageUrl")
              .value
              .trim() || null,

          specs:
            document
              .getElementById("specs")
              .value
              .trim() || null,

          description:
            document
              .getElementById("description")
              .value
              .trim() || null,

          stock:
            document
              .getElementById("stock")
              .checked,

          featured:
            document
              .getElementById("featured")
              .checked

        };


        const message =
          document.getElementById(
            "formMessage"
          );


        message.className =
          "success";

        message.textContent =
          "جاري الحفظ...";


        try {

          let response;


          if (id) {

            response =
              await authFetch(
                `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(id)}`,
                {
                  method: "PATCH",

                  headers: {
                    "Content-Type":
                      "application/json",

                    "Prefer":
                      "return=minimal"
                  },

                  body:
                    JSON.stringify(product)
                }
              );

          }

          else {

            response =
              await authFetch(
                `${SUPABASE_URL}/rest/v1/products`,
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json",

                    "Prefer":
                      "return=minimal"
                  },

                  body:
                    JSON.stringify(product)
                }
              );

          }


          if (!response.ok) {

            const errorText =
              await response.text();

            throw new Error(
              errorText ||
              "حدث خطأ أثناء الحفظ"
            );

          }


          message.className =
            "success";


          message.textContent =
            id
              ? "تم تعديل المنتج بنجاح ✅"
              : "تم إضافة المنتج بنجاح ✅";


          resetForm();

          await loadProducts();

        }

        catch (error) {

          console.error(error);

          message.className =
            "error";

          message.textContent =
            "حدث خطأ: " +
            error.message;

        }

      }
    );


  /* ==========================================
     EDIT PRODUCT
  ========================================== */

  window.editProduct =
    function(id) {

      const product =
        products.find(
          item =>
            Number(item.id) ===
            Number(id)
        );


      if (!product) return;


      document.getElementById(
        "productId"
      ).value =
        product.id;


      document.getElementById(
        "name"
      ).value =
        product.name || "";


      document.getElementById(
        "category"
      ).value =
        product.category || "";


      document.getElementById(
        "price"
      ).value =
        product.price || "";


      document.getElementById(
        "oldPrice"
      ).value =
        product.old_price || "";


      document.getElementById(
        "imageUrl"
      ).value =
        product.image_url || "";


      document.getElementById(
        "specs"
      ).value =
        product.specs || "";


      document.getElementById(
        "description"
      ).value =
        product.description || "";


      document.getElementById(
        "stock"
      ).checked =
        Boolean(product.stock);


      document.getElementById(
        "featured"
      ).checked =
        Boolean(product.featured);


      document.getElementById(
        "formTitle"
      ).textContent =
        "تعديل المنتج";


      document
        .getElementById("cancelEdit")
        .classList.remove(
          "hidden"
        );


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };


  /* ==========================================
     DELETE PRODUCT
  ========================================== */

  window.deleteProduct =
    async function(id) {

      const confirmed =
        confirm(
          "هل أنت متأكد من حذف هذا المنتج؟"
        );


      if (!confirmed) return;


      try {

        const response =
          await authFetch(
            `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(id)}`,
            {
              method: "DELETE",

              headers: {
                "Prefer":
                  "return=minimal"
              }
            }
          );


        if (!response.ok) {

          throw new Error(
            await response.text()
          );

        }


        await loadProducts();

      }

      catch (error) {

        console.error(error);

        alert(
          "حدث خطأ أثناء حذف المنتج:\n" +
          error.message
        );

      }

    };


  /* ==========================================
     RESET FORM
  ========================================== */

  function resetForm() {

    document
      .getElementById("productForm")
      .reset();


    document.getElementById(
      "productId"
    ).value = "";


    document.getElementById(
      "stock"
    ).checked = true;


    document.getElementById(
      "formTitle"
    ).textContent =
      "إضافة منتج جديد";


    document
      .getElementById("cancelEdit")
      .classList.add(
        "hidden"
      );

  }


  document
    .getElementById("cancelEdit")
    .addEventListener(
      "click",
      resetForm
    );


  /* ==========================================
     LOGOUT
  ========================================== */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async function() {

        try {

          const token =
            getAccessToken();


          if (token) {

            await fetch(
              `${SUPABASE_URL}/auth/v1/logout`,
              {
                method: "POST",

                headers: {
                  "apikey": SUPABASE_KEY,

                  "Authorization":
                    `Bearer ${token}`
                }
              }
            );

          }

        }

        catch (error) {

          console.error(error);

        }


        clearSession();

        showLogin();

      }
    );


  /* ==========================================
     HTML ESCAPE
  ========================================== */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==========================================
     AUTO LOGIN
  ========================================== */

  async function initializeApp() {

    const accessToken =
      getAccessToken();

    const refreshToken =
      getRefreshToken();


    if (!accessToken || !refreshToken) {

      showLogin();

      return;

    }


    try {

      /*
        نجدد الـSession عند فتح الصفحة،
        وده يمنع استخدام Access Token قديم.
      */

      await refreshSession();

      showAdmin();

      await loadProducts();

    }

    catch (error) {

      console.error(error);

      clearSession();

      showLogin();

    }

  }


  initializeApp();

</script></body>
