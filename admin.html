<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Zone Admin</title><link rel="stylesheet" href="style.css"></head>
<body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span>PC</span> ZONE</a><a class="text-link" href="index.html">← العودة للمتجر</a></div></header>
<main class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">ADMIN DASHBOARD</span><h2>إدارة المنتجات</h2></div></div>
<div class="admin-panel">
<h3 id="formTitle">إضافة منتج جديد</h3>
<input id="id" type="hidden">
<div class="admin-grid"><label>اسم المنتج<input id="name" placeholder="مثال: RTX 4060"></label><label>السعر<input id="price" type="number" placeholder="25000"></label><label>القسم<select id="category"><option value="laptops">لابتوبات</option><option value="pcs">PC & Gaming</option><option value="components">قطع الكمبيوتر</option><option value="monitors">الشاشات</option><option value="accessories">إكسسوارات</option><option value="other">منتجات أخرى</option></select></label><label>رابط الصورة<input id="image" placeholder="https://..."></label><label class="wide">المواصفات<input id="specs" placeholder="Core i7 • RAM 16GB • SSD 512GB"></label><label class="wide">الوصف<textarea id="description" rows="3" placeholder="وصف المنتج..."></textarea></label><label class="check"><input id="stock" type="checkbox" checked> المنتج متوفر</label></div>
<div class="hero-actions"><button class="btn primary" onclick="save()">حفظ المنتج</button><button class="btn ghost" onclick="resetForm()">تفريغ</button></div></div>
<div id="adminList" class="product-grid" style="margin-top:30px"></div></div></main>
<script>
const defaults=JSON.parse(localStorage.getItem("pczone_products")||"null")||[];
function products(){return JSON.parse(localStorage.getItem("pczone_products")||"[]")}
function money(n){return Number(n).toLocaleString("en-US")+" ج.م"}
function saveProducts(p){localStorage.setItem("pczone_products",JSON.stringify(p))}
function save(){let p=products(),id=document.getElementById("id").value;let item={id:id?Number(id):Date.now(),name:name.value,price:Number(price.value||0),category:category.value,image:image.value,specs:specs.value,description:description.value,stock:stock.checked};if(!item.name)return alert("اكتب اسم المنتج");if(id)p=p.map(x=>x.id===Number(id)?item:x);else p.unshift(item);saveProducts(p);resetForm();render()}
function edit(id){let p=products().find(x=>x.id===id);document.getElementById("id").value=p.id;name.value=p.name;price.value=p.price;category.value=p.category;image.value=p.image||"";specs.value=p.specs||"";description.value=p.description||"";stock.checked=p.stock;scrollTo({top:0,behavior:"smooth"})}
function del(id){if(confirm("حذف المنتج؟")){saveProducts(products().filter(x=>x.id!==id));render()}}
function resetForm(){["id","name","price","image","specs","description"].forEach(x=>document.getElementById(x).value="");stock.checked=true}
function render(){adminList.innerHTML=products().map(p=>`<article class="product"><div class="product-img">${p.image?`<img src="${p.image}">`:"<div class='noimg'>▦</div>"}</div><div class="product-body"><h3>${p.name}</h3><div class="spec">${p.specs||""}</div><div class="price">${money(p.price)}</div><div class="product-actions"><button class="small-btn" onclick="edit(${p.id})">تعديل</button><button class="small-btn" onclick="del(${p.id})">حذف</button></div></div></article>`).join("")}
render();
</script></body></html>
